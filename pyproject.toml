[project]
name = "hermes"
version = "1.0.0"
description = "Hermes — système de trading quantitatif sur perpétuels crypto (long/short) : données, ML, validation statistique, portefeuille, risque, exécution OKX."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "websockets>=12",
  "typer>=0.12",
  "numba>=0.60",
  "threadpoolctl>=3",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]

[project.scripts]
hermes = "hermes.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF", "SIM"]
ignore = ["N803", "N806", "N815", "RUF001", "RUF002", "RUF003", "E741", "B905", "SIM108", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: tests longs (entraînement complet)",
  "network: exige un accès réseau (jamais en CI)",
]
