[project]
name = "okx-quant-jev"
version = "0.1.0"
description = "Plateforme quantitative autonome OKX + JEV — recherche, PAPER/SHADOW/DEMO, LIVE désactivé par défaut."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.28,<1",
  "websockets>=15,<16",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "numpy>=2.2,<3",
  "polars>=1.30,<2",
  "pyarrow>=20,<22",
  "duckdb>=1.3,<2",
  "scikit-learn>=1.6,<2",
  "lightgbm>=4.6,<5",
  "cvxpy>=1.6,<2",
  "clarabel>=0.10,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "typer>=0.15,<1",
  "structlog>=25,<26",
  "prometheus-client>=0.22,<1",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
ui-test = ["playwright>=1.50,<2"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<2",
  "pytest-cov>=6,<7",
  "hypothesis>=6.130,<7",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-PyYAML>=6",
  "freezegun>=1.5,<2",
]

[project.scripts]
okxq = "okxq.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okxq"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "T20", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "RUF012", "B008", "S311", "E501", "S603", "S607", "S104", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "B", "N", "ASYNC"]
"scripts/**" = ["T20", "S"]
"src/okxq/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src/okxq"]
exclude = ["src/okxq/persistence/migrations/"]

[[tool.mypy.overrides]]
module = ["okxq.research.*", "okxq.features.*", "okxq.backtest.*", "okxq.portfolio.*"]
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "property: tests de propriété Hypothesis",
  "integration: nécessite PostgreSQL (OKXQ_TEST_DATABASE_URL)",
  "connected: nécessite le réseau et des clés (opt-in explicite, jamais en LIVE)",
  "chaos: scénarios de panne",
  "e2e: parcours complet hors ligne",
  "contract: contrats fournisseurs sur fixtures",
]
filterwarnings = ["error::DeprecationWarning:okxq.*"]

[tool.coverage.run]
source = ["okxq"]
branch = true
