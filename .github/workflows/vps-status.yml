# État de la plateforme sur le VPS, et pose des clés par service (jamais dans le dépôt, jamais
# imprimées, et JAMAIS saisies dans une entrée de workflow : la valeur d'une entrée est affichée sur
# la page du run, publique pour un dépôt public).
name: VPS status

on:
  workflow_dispatch:
    inputs:
      poser_cles_okx:
        description: "oui : poser OKX_API_KEY/SECRET/PASSPHRASE (secrets du dépôt) dans env/gateway.env et redémarrer le gateway"
        required: false
        default: ""
      poser_cle_typesafe:
        description: "oui : poser TYPESAFE_API_KEY (secret du dépôt) dans env/jev-worker.env et redémarrer jev-worker"
        required: false
        default: ""
      tourner_cle_operateur:
        description: "oui : RÉVOQUER la clé opérateur en place et en générer une neuve (toutes les clés dérivées changent)"
        required: false
        default: ""

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS: ${{ vars.VPS_HOST || '178.104.191.79' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ssh tooling
        run: sudo apt-get update -qq && sudo apt-get -y -qq install sshpass
      - name: Resolve SSH access
        env:
          PW: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -z "${PW:-}" ]; then
            echo "::error::secret VPS_PASSWORD absent — Settings → Secrets and variables → Actions"; exit 1
          fi
          ALT="${PW}.Hermes1"
          echo "::add-mask::$PW"; echo "::add-mask::$ALT"
          SSHOPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          try() { sshpass -p "$1" ssh $SSHOPTS "root@$VPS" "echo __ok__" 2>/dev/null | grep -q __ok__; }
          if try "$PW"; then CUR="$PW"; elif try "$ALT"; then CUR="$ALT"; else echo "::error::cannot authenticate"; exit 1; fi
          echo "SSHPASS=$CUR" >> "$GITHUB_ENV"

      - name: Poser les clés OKX (gateway seulement)
        if: ${{ inputs.poser_cles_okx == 'oui' }}
        env:
          K: ${{ secrets.OKX_API_KEY }}
          S: ${{ secrets.OKX_API_SECRET }}
          P: ${{ secrets.OKX_API_PASSPHRASE }}
          R: ${{ secrets.OKX_ACCOUNT_REGION_PROFILE }}
        run: |
          [ -z "$K$S$P" ] && { echo "::error::secrets OKX_API_KEY / OKX_API_SECRET / OKX_API_PASSPHRASE absents"; exit 1; }
          printf '%s\n%s\n%s\n%s\n' "$K" "$S" "$P" "$R" | sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            IFS= read -r K; IFS= read -r S; IFS= read -r P; IFS= read -r R
            F=/opt/okxq/env/gateway.env; touch "$F"; chmod 600 "$F"
            for kv in "OKX_API_KEY=$K" "OKX_API_SECRET=$S" "OKX_API_PASSPHRASE=$P" "OKX_ACCOUNT_REGION_PROFILE=$R"; do
              k=${kv%%=*}; sed -i "/^$k=/d" "$F"; echo "$kv" >> "$F"; done
            cd /opt/okxq && docker compose up -d --force-recreate gateway >/dev/null 2>&1 || true
            echo "  clés OKX posées dans env/gateway.env (gateway seul), gateway redémarré"
          '

      - name: Poser la clé TypeSafe (jev-worker seulement)
        if: ${{ inputs.poser_cle_typesafe == 'oui' }}
        env:
          T: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          [ -z "$T" ] && { echo "::error::secret TYPESAFE_API_KEY absent"; exit 1; }
          printf '%s\n' "$T" | sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            IFS= read -r T; F=/opt/okxq/env/jev-worker.env; touch "$F"; chmod 600 "$F"
            sed -i "/^TYPESAFE_API_KEY=/d" "$F"; echo "TYPESAFE_API_KEY=$T" >> "$F"
            cd /opt/okxq && docker compose up -d --force-recreate jev-worker >/dev/null 2>&1 || true
            echo "  clé TypeSafe posée dans env/jev-worker.env, jev-worker redémarré"
          '

      - name: Tourner la clé opérateur
        if: ${{ inputs.tourner_cle_operateur == 'oui' }}
        run: |
          # Toutes les clés d'accès sont dérivées de `OPERATOR_AUTH_SECRET` par HMAC : changer ce
          # secret révoque d'un coup les clés reader, operator et admin. À faire dès qu'une clé a pu
          # être vue — un journal recopié, une capture d'écran, un lien partagé.
          #
          # La nouvelle valeur est engendrée SUR LA MACHINE et n'est jamais imprimée ici : le journal
          # de ce run est public. Son propriétaire la relit sur le serveur.
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            F=/opt/okxq/env/api.env
            [ -f "$F" ] || { echo "::error::/opt/okxq/env/api.env absent : plateforme non installée"; exit 1; }
            NEUF=$(openssl rand -hex 32)
            sed -i "/^OPERATOR_AUTH_SECRET=/d" "$F"
            printf "OPERATOR_AUTH_SECRET=%s\n" "$NEUF" >> "$F"
            chmod 600 "$F"
            cd /opt/okxq && docker compose up -d --force-recreate api >/dev/null 2>&1 || true
            # `restart` ne suffit PAS : il réutilise le conteneur, et un fichier d'environnement
            # n'est relu qu'à la CRÉATION. La rotation semblait réussir — le fichier changeait — et
            # l'ancienne clé restait valide dans le conteneur. Une révocation qui ne révoque rien est
            # pire qu'une absence de rotation : on se croit protégé. D'où `--force-recreate`, et la
            # vérification ci-dessous plutôt qu'une supposition.
            for _ in $(seq 1 30); do
              curl -s -o /dev/null --max-time 3 http://127.0.0.1:8899/health/live && break
              sleep 2
            done
            NOUVELLE=$(printf okxq-ui-key:v1:admin | openssl dgst -sha256 -hmac "$NEUF" -r | cut -d" " -f1)
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 6 \
              -H "Authorization: Bearer $NOUVELLE" http://127.0.0.1:8899/api/v1/system/status)
            if [ "$CODE" != "200" ]; then
              echo "::error::la NOUVELLE clé est refusée ($CODE) : le conteneur n a pas relu son environnement, l ancienne clé reste donc valide"
              exit 1
            fi
            echo "  nouvelle clé acceptée (200) : les clés dérivées précédentes sont bien révoquées"
            echo "  la lire (sur CETTE machine) :"
            echo "      S=\$(grep ^OPERATOR_AUTH_SECRET= /opt/okxq/env/api.env | cut -d= -f2-)"
            echo "      printf okxq-ui-key:v1:admin | openssl dgst -sha256 -hmac \"\$S\" -r | cut -d\" \" -f1"
          '

      - name: Status report
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" bash -s < deploy/etat.sh
