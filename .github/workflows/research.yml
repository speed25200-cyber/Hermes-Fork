# Recherche sur données réelles, sur un runner GitHub (réseau ouvert vers les archives Binance).
# Télécharge l'historique, entraîne en walk-forward, évalue hors échantillon, puis publie le rapport
# (reports/<date>/) sur la branche. Le modèle entraîné est publié comme artefact du workflow.
name: Research

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Fichier de configuration"
        default: "configs/research.yaml"
      overrides:
        description: "Surcharges (-s clé=valeur ...), ex. -s data.start=2022-01-01"
        default: ""
      n_null:
        description: "Répliques du test nul"
        default: "40"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: pip install -e .
      - name: Cache des archives
        uses: actions/cache@v4
        with:
          path: data/raw
          key: binance-raw-${{ github.run_id }}
          restore-keys: binance-raw-
      - name: Recherche
        env:
          CONFIG: ${{ inputs.config }}
          OVERRIDES: ${{ inputs.overrides }}
          N_NULL: ${{ inputs.n_null }}
        run: |
          OUT="reports/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086
          hermes research run -c "$CONFIG" $OVERRIDES --out "$OUT" --n-null "$N_NULL"
      - name: Publier le modèle
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.run_id }}
          path: ${{ env.OUT }}/model
          retention-days: 90
      - name: Publier le rapport sur la branche
        run: |
          rm -rf "$OUT/model"
          git config user.name "hermes-research"
          git config user.email "hermes-research@users.noreply.github.com"
          git add "$OUT" reports/trials.jsonl
          git commit -m "Rapport de recherche $OUT"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
