# PAPER : données de marché publiques réelles, ordres simulés localement, aucun endpoint privé.
extends: base.yaml
project:
  mode: PAPER
account:
  scope: paper-local
api:
  # Tableau de bord consultable SANS clé : décision d'exploitation de l'exploitant, prise en
  # connaissance de cause. Le port est joignable depuis Internet, donc toute personne qui atteint
  # l'adresse voit l'état du compte papier.
  #
  # `lecture` et non `total` : la consultation s'ouvre, les commandes opérateur (pause, annulation
  # des entrées, demande de flatten, reprise) restent refusées et exigent une clé. Ouvrir un
  # tableau de bord et ouvrir les commandes d'un moteur d'exécution ne sont pas la même décision.
  #
  # Ce réglage est REFUSÉ par la validation en DEMO et en LIVE : il ne suivra pas la plateforme le
  # jour où de vrais ordres partent.
  acces_sans_cle: lecture
