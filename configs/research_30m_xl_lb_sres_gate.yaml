# research_30m_xl_lb_sres avec une garde de régime : l'estimation d'IC (donc la taille du livre) est divisée par
# deux les jours où BTC a clôturé la veille à plus de 15 % sous son plus haut de 90 jours. Motivation mesurée
# (docs/RESULTS.md, § 10) : avant 2026, l'IC transversal a été plus faible dans 4 des 5 baisses de ce type.
# La variable a été choisie parmi ~30 examinées sur les mêmes données hors échantillon : le résultat est une
# borne haute, et les 15 %, 90 jours et 0,5 sont fixés une fois pour toutes (jamais réajustés). Un essai de
# plus au registre (DSR).
name: hermes-30m-xl-lb-sres-gate
seed: 42
data:
  source: binance_archive
  cache_dir: data
  bar: 30m
  source_bar: 15m
  start: "2022-06-01"
  include_premium: true
  intrabar: false
  universe:
    top_n: 30
    liquidity_lookback_days: 30
    min_history_days: 60
    reselect_every_days: 7
features:
  return_minutes: [30, 60, 120, 240, 480, 1440, 4320, 10080, 20160, 43200]
  vol_minutes: [240, 1440, 4320]
  flow_minutes: [60, 240, 1440]
  funding_minutes: [480, 1440, 4320, 10080, 43200]
  trend_pairs_minutes: [[240, 1440], [1440, 5760], [5760, 20160]]
  range_minutes: [1440, 10080, 43200]
  day_minutes: 1440
  long_minutes: 10080
  zscore_minutes: 43200
  vol_halflife_minutes: 1440
  max_lookback_minutes: 43200
labels:
  horizons: [16, 48, 96]
  primary_horizon: 48
  residualize: style
model:
  gbm:
    learning_rate: 0.05
    n_estimators: 1000
    early_stopping_rounds: 100
    num_leaves: 31
    min_data_in_leaf: 3000
    feature_fraction: 0.6
    lambda_l2: 10.0
    seeds: [1, 2]
  linear:
    alpha: 300.0
  ensemble: ic_weighted
  market_model: true
validation:
  expanding: true
  min_train_days: 365
  test_days: 60
  val_days: 45
  embargo_minutes: 2880
  train_sample_minutes: 60
portfolio:
  vol_target_annual: 0.20
  gross_max: 2.5
  net_max: 0.25
  weight_max: 0.15
  beta_neutral: true
  holding_horizon: 48
  signal_halflife: 0.5
  cost_scale_floor: 0.5
  style_neutral: true
  style_risk: 1.0
  cost_aversion: 2.0
  ic_ref: 0.03
  cov_halflife_days: 7
  regime_gate_symbol: BTCUSDT
  regime_gate_lookback_days: 90
  regime_gate_drawdown: 0.15
  regime_gate_scale: 0.5
costs:
  maker_fee: 0.0002
  taker_fee: 0.0005
  maker_fill_ratio: 0.6
  min_half_spread_bps: 1.0
  impact_coef: 0.7
risk:
  daily_loss_limit: 0.03
  drawdown_soft: 0.10
  drawdown_hard: 0.25
  es_limit_daily: 0.04
