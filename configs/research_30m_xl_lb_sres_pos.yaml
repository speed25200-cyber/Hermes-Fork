# research_30m_xl_lb_sres avec le positionnement des gros comptes Binance (archives « metrics ») : ratio long/short
# des positions des « top traders », écart à sa moyenne de 28 jours et variation sur un jour, lus une bougie en
# retard. Test pré-enregistré (docs/RESULTS.md, § 11) sur 17 variables d'intérêt ouvert et de ratios : sélection
# sur 2023-08 → 2025-12 seulement (IC partiel, en plus du score du modèle, |t| ≥ 3 et même signe en 2024 et 2025),
# 2026 gardé comme contrôle. L'écart du ratio des gros comptes : IC partiel −0,021 (t −3,5), puis −0,023 en 2026
# (t −2,3). Les variations d'intérêt ouvert se sont retournées en 2026 : non retenues. Un essai de plus (DSR).
name: hermes-30m-xl-lb-sres-pos
seed: 42
data:
  source: binance_archive
  cache_dir: data
  bar: 30m
  source_bar: 15m
  start: "2022-06-01"
  include_premium: true
  include_metrics: true
  intrabar: false
  universe:
    top_n: 30
    liquidity_lookback_days: 30
    min_history_days: 60
    reselect_every_days: 7
features:
  return_minutes: [30, 60, 120, 240, 480, 1440, 4320, 10080, 20160, 43200]
  vol_minutes: [240, 1440, 4320]
  flow_minutes: [60, 240, 1440]
  funding_minutes: [480, 1440, 4320, 10080, 43200]
  trend_pairs_minutes: [[240, 1440], [1440, 5760], [5760, 20160]]
  range_minutes: [1440, 10080, 43200]
  day_minutes: 1440
  long_minutes: 10080
  zscore_minutes: 43200
  vol_halflife_minutes: 1440
  max_lookback_minutes: 43200
  positioning: [ls_top]
labels:
  horizons: [16, 48, 96]
  primary_horizon: 48
  residualize: style
model:
  gbm:
    learning_rate: 0.05
    n_estimators: 1000
    early_stopping_rounds: 100
    num_leaves: 31
    min_data_in_leaf: 3000
    feature_fraction: 0.6
    lambda_l2: 10.0
    seeds: [1, 2]
  linear:
    alpha: 300.0
  ensemble: ic_weighted
  market_model: true
validation:
  expanding: true
  min_train_days: 365
  test_days: 60
  val_days: 45
  embargo_minutes: 2880
  train_sample_minutes: 60
portfolio:
  vol_target_annual: 0.20
  gross_max: 2.5
  net_max: 0.25
  weight_max: 0.15
  beta_neutral: true
  holding_horizon: 48
  signal_halflife: 0.5
  cost_scale_floor: 0.5
  style_neutral: true
  style_risk: 1.0
  cost_aversion: 2.0
  ic_ref: 0.03
  cov_halflife_days: 7
costs:
  maker_fee: 0.0002
  taker_fee: 0.0005
  maker_fill_ratio: 0.6
  min_half_spread_bps: 1.0
  impact_coef: 0.7
risk:
  daily_loss_limit: 0.03
  drawdown_soft: 0.10
  drawdown_hard: 0.25
  es_limit_daily: 0.04
