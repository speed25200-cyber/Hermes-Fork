# Profil PAPER de recherche (§63). Les valeurs sont des hypothèses de configuration, pas des réglages
# financiers validés. Aucun secret ici : les clés vivent dans l'environnement du seul service concerné.
project:
  name: okx-quant-jev
  schema_version: 1
  mode: PAPER
  live_enabled: false
  timezone_storage: UTC
  timezone_display: Europe/Zurich

account:
  scope: paper-local
  settlement_currency: USDT
  position_mode: net
  margin_mode: isolated
  paper_initial_equity_usdt: "100000"
  real_capital_usdt: null

runtime:
  decision_interval_seconds: 60
  decision_budget_ms: 3000
  decision_overlap_policy: skip
  max_clock_offset_ms: 250
  require_single_execution_writer: true
  lease_ttl_ms: 5000
  lease_heartbeat_ms: 1000

universe:
  instrument_type: SWAP
  contract_type: linear
  settlement_currency: USDT
  target_size: 20
  minimum_eligible: 10
  maximum_eligible: 30
  minimum_history_days: 30
  refresh_interval_seconds: 3600
  on_removal: manage_existing_reduce_only
  min_notional_volume_24h_usdt: "5000000"
  max_relative_spread: 0.0015
  min_depth_notional_usdt: "20000"
  max_missing_fraction: 0.05

market_data:
  orderbook_channel: books
  max_quote_age_ms: 2000
  max_private_state_age_ms: 15000
  require_valid_sequence: true
  checksum_policy: channel_version_aware
  reject_crossed_book: true
  persist_raw: true
  fail_on_unrecoverable_gap: true
  max_forward_fill_ms:
    book: 2000
    trade: 60000
    funding: 3600000
    open_interest: 300000

strategy:
  horizons_seconds: [60, 120, 180, 300, 600, 900]
  optimizer_horizon_seconds: 300
  allow_no_trade: true
  cost_basis: MID
  allow_unvalidated_model: false
  allow_unvalidated_fallback: false
  uncertainty_penalty_coefficient: 1.0
  min_edge_score: 0.0

risk:
  max_gross_equity_multiple: 1.0
  max_abs_net_equity_multiple: 0.10
  max_asset_equity_multiple: 0.10
  max_cluster_gross_equity_multiple: 0.30
  max_abs_btc_beta_exposure: 0.10
  max_abs_eth_beta_exposure: 0.10
  max_margin_utilization: 0.50
  modeled_risk_per_idea_fraction: 0.001
  daily_loss_halt_fraction: 0.01
  drawdown_review_fraction: 0.05
  include_pending_and_unknown_orders: true
  approval_ttl_ms: 1000
  auto_resume_after_critical_halt: false
  resume_stability_seconds: 300
  max_orders_per_minute: 30
  liquidation_distance_min_fraction: 0.25
  margin_buffer_fraction: 0.20

execution:
  allowed_entry_order_types: [post_only, ioc]
  allow_market_entries: false
  max_order_intent_age_ms: 2000
  # Participation : fraction du volume notionnel RÉELLEMENT observé sur la fenêtre, plus un plafond
  # indépendant de profondeur consommable. Jamais de volume futur, jamais de division par zéro.
  max_order_participation_fraction: 0.01
  participation_window_seconds: 60
  participation_reference: observed_notional_volume
  max_depth_consumption_fraction: 0.10
  max_turnover_equity_fraction_per_decision: 0.30
  max_price_chase_attempts: 2
  require_reconciliation_before_entries: true
  cancel_all_after_enabled: true
  cancel_all_after_timeout_seconds: 30
  cancel_all_after_heartbeat_seconds: 1
  emergency_market_exit_enabled: false
  passive_entry_max_wait_ms: 20000
  execution_policy_version: exec-policy-v1

jev:
  enabled: true
  influence_mode: shadow
  model: jev-1.13.0
  endpoint: https://api.typesafe.ai/v1/systemone
  questions_path: configs/jev_questions.v1.json
  timeout_total_ms: 1500
  max_concurrency: 2
  max_queue_length: 100
  max_document_characters: 20000
  default_event_max_age_seconds: 3600
  max_retry_attempts: 1
  max_daily_spend_usd: "5.00"
  source_allowlist_path: configs/sources.example.yaml
  on_unavailable: validated_quant_only_else_halt_entries
  never_receive_okx_credentials: true
  circuit_breaker_failures: 5
  circuit_breaker_cooldown_seconds: 300

research:
  random_seed: 25200
  max_trials_per_experiment: 30
  require_temporal_oof_stacking: true
  require_frozen_final_test: true
  require_cost_stress_tests: true
  promotion_auto_approve: false
  max_job_minutes: 120
  max_cpu_threads: 2

api:
  bind_host: 127.0.0.1
  bind_port: 8899
  require_authentication: true
  allow_browser_live_activation: false
  session_ttl_minutes: 720
  cors_origins: []
  serve_frontend: true
  metrics_enabled: true

storage:
  raw_format: parquet
  compression: zstd
  require_durable_order_journal: true
  audit_append_only: true
  data_root: data
  raw_retention_days: 90

observability:
  log_level: INFO
  log_json: true
  alert_sink: local
  alert_dedup_seconds: 300
