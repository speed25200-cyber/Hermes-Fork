# ExperimentPlan (§39) : enregistré AVANT exécution. Les résultats ne modifient pas ce fichier.
plan_id: exp-baseline-example
hypothesis: "Les features de microstructure et de séries temporelles prédisent le rendement mid à 300 s au-delà des coûts."
period:
  start: "2026-06-01T00:00:00Z"
  end: "2026-09-01T00:00:00Z"
  frozen_final_test_start: "2026-08-15T00:00:00Z"
universe:
  source: point_in_time
  minimum_instruments: 10
data:
  quality_level: A
  dataset: tests/fixtures/golden
features:
  groups: [microstructure, timeseries, cross_asset, derivatives]
  version: features-v1
labels:
  target: future_mid_return
  # L'horizon de 60 s est retiré : le chemin de prix des labels est échantillonné au pas de décision
  # (60 s), la fenêtre d'entrée ne peut donc pas être plus courte, et un horizon de 60 s ne laisse
  # aucune durée de détention entre l'entrée et la sortie. `LabelSpec` refuse la combinaison.
  horizons_seconds: [300, 900]
  cost_basis: MID
model:
  family: linear
  # `target: future_mid_return` est une RÉGRESSION : les candidats doivent être des régresseurs.
  # `logistic` était un classifieur — une probabilité n'est pas un rendement, et la CLI l'écartait en
  # le signalant dans ses notes plutôt que de réinterpréter le plan en silence.
  # Candidats de RÉGRESSION effectivement implémentés (voir research.training.REGRESSION_CANDIDATES) ;
  # `flat` est le témoin « ne rien faire », contre lequel tout le reste doit se comparer.
  candidates: [flat, ridge, momentum, mean_reversion]
  max_trials: 30
splits:
  scheme: nested_walk_forward
  train_days: 30
  validation_days: 7
  test_days: 7
  purge_seconds: 900
  embargo_seconds: 900
costs:
  fee_taker: "0.0005"
  fee_maker: "0.0002"
  stress_multipliers: [1.0, 1.5, 2.0]
success_criteria:
  primary: net_pnl_bootstrap_lower_bound_positive
  negative_controls: [shuffled_labels, future_shifted_features]
budget:
  max_trials: 30
  max_minutes: 60
seed: 25200
