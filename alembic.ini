; Configuration Alembic.
;
; L'URL de connexion n'est volontairement PAS ici : elle porte un mot de passe et un fichier versionné
; n'est pas un coffre. `migrations/env.py` la lit dans OKXQ_DATABASE_URL (ou DATABASE_URL), et la CLI
; `okxq db` la transmet par les attributs de configuration — jamais par une option ini, jamais dans un
; journal. Sans variable d'environnement, la migration échoue : aucune base par défaut, pour ne jamais
; migrer une base que personne n'a désignée.

[alembic]
script_location = src/okxq/persistence/migrations
prepend_sys_path = src

; Numérotation manuelle et ordonnée (`alembic revision --rev-id 0002 -m "..."`) : en reprise
; d'incident, un opérateur doit pouvoir lire l'ordre des révisions sans consulter le graphe.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
; WARNING et non INFO : le niveau INFO de `sqlalchemy.engine` journalise la connexion et ses
; paramètres, donc potentiellement un secret.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
